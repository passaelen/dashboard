<!DOCTYPE html>

<html lang="fr">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achats</title>


<link rel="stylesheet" href="couleurs.css?v=17">
<link rel="stylesheet" href="style.css?v=14">
 

</head>

<body>

<div class="container">

<!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <h2>🧾 Achats ETF</h2>
            <small>Journal d'exécution</small>
        </div>
        <div class="header-right">
            <a href="index.html" class="badge">← Retour</a>
        </div>
    </div>

<!-- TABLE -->
    <div class="card">
        <h3>Historique</h3>
        
                    <table>
                            <thead>
                                    <tr>
                                        <th>Date(s)</th>
                                        <th>
                                            <span id="filtre-type" style="cursor:pointer;">
                                                Type ▾
                                            </span>
                                        </th>
                                        <th>Part(s)</th>
                                        <th>Montant(s)</th>
                                    </tr>
                            </thead>
                            <div id="panneau-filtre" style="display:none; padding:12px; margin-bottom:12px; border:1px solid #334155; border-radius:10px;">
                                <div id="options-filtre">
                                    <label><input type="checkbox" value="MONDE (VWRA)" checked> Monde (VWRA)</label><br>
                                    <label><input type="checkbox" value="MONDE (SPYY)" checked> Monde (SPYY)</label><br>
                                    <label><input type="checkbox" value="SENIOR" checked> Seniors</label><br>
                                    <label><input type="checkbox" value="JUNIOR" checked> Juniors</label><br>
                                    <label><input type="checkbox" value="OR" checked> Or</label><br>
                                    <label><input type="checkbox" value="ARGENT" checked> Argent</label><br>
                                    <label><input type="checkbox" value="PETROLE" checked> Pétrole</label>
                                </div>
                            </div>
                            <tbody id="table-achats"></tbody>
                    </table>
        
                      <div class="total-line">
                        <span>Total investi</span>
                        <span id="total-achats"></span>
                      </div>
    </div> 
</div> 


<script src="achats.js"></script>

<script>
// ===== HELPERS =====
function euro(v){
    return Math.round(v).toLocaleString('fr-BE') + " €";
}

// ===== COULEUR TYPE =====
function getClassByType(type){
    switch(type){
        case "ETF_MONDE (VWRA)": return "dot-monde";
        case "ETF_MONDE (SPYY)": return "dot-monde-spyy";
        case "ETF_SENIOR": return "dot-seniors";
        case "ETF_JUNIOR": return "dot-juniors";
        case "ETF_OR":     return "dot-etf-or";
        case "ETF_ARGENT": return "dot-etf-argent";
        case "ETF_PETROLE": return "dot-etf-petrole";
        default: return "";
    }
}

// ===== RENDER =====
function renderAchats(){

    const tbody = document.getElementById("table-achats");

    // tri DESC (plus récent en haut)
    const selections = [...document.querySelectorAll("#options-filtre input:checked")]
    .map(input => input.value);

 
    const achatsETF = achats.filter(a => {
        if (!a.type.includes("ETF")) return false;
    
        const type = a.type.replace("ETF_", "");
        return selections.includes(type);
    });

 
    const sorted = achatsETF.sort((a,b)=>{
    return new Date(b.date.split("/").reverse().join("-")) 
         - new Date(a.date.split("/").reverse().join("-"));
    });

    tbody.innerHTML = "";
    sorted.forEach(a => {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${a.date}</td>
            <td>
                <span class="dot ${getClassByType(a.type)}"></span>
                ${a.type.replace("ETF_", "")}
            </td>
            <td class="center">${a.parts || "-"}</td>
            <td class="amount">${euro(a.montant)}</td>
        `;

        tbody.appendChild(row);
    });

const total = sorted.reduce((sum, a) => sum + (a.montant || 0), 0);
document.getElementById("total-achats").innerText = euro(total);
    
}
renderAchats();

// ===== OUVERTURE DU FILTRE =====
document.getElementById("filtre-type").addEventListener("click", () => {
    const panneau = document.getElementById("panneau-filtre");

    panneau.style.display =
        panneau.style.display === "none" ? "block" : "none";
});

 
// ===== APPLICATION DU FILTRE =====
document.querySelectorAll("#options-filtre input").forEach(input => {
    input.addEventListener("change", () => {
        renderAchats();
    });
});

    
</script>
</body>
</html>
